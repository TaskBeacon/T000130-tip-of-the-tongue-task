  material_version: tot-zh-authored-1
  items:
    tot01:
      target: 日晷
      definition: '古人利用太阳照出的指针影子，

        在刻有时刻的盘面上读出时间的器具。'
      initial_sound: r
      character_count: 2
      accepted:
      - 日晷
    tot02:
      target: 榫卯
      definition: '木构件连接时，一端凸出、另一端凹入，

        彼此嵌合而不靠钉子的连接结构。'
      initial_sound: s
      character_count: 2
      accepted:
      - 榫卯
    tot03:
      target: 菖蒲
      definition: '端午节常和艾草一起挂起、叶片像剑，

        全株有香气、常生长在水边的植物。'
      initial_sound: ch
      character_count: 2
      accepted:
      - 菖蒲
    tot04:
      target: 缫丝
      definition: '把蚕茧放进热水，再抽出长丝并合，

        制作生丝的加工过程。'
      initial_sound: s
      character_count: 2
      accepted:
      - 缫丝
      - 繅絲
    tot05:
      target: 耄耋
      definition: '古汉语中泛指八九十岁高龄的说法，

        常用于祝贺老人长寿。'
      initial_sound: m
      character_count: 2
      accepted:
      - 耄耋
    tot06:
      target: 司南
      definition: '中国古代用天然磁石制成的辨向器具，

        常见复原形状为盘上的一把勺子。'
      initial_sound: s
      character_count: 2
      accepted:
      - 司南
    tot07:
      target: 三棱镜
      definition: '横截面呈三角形的透明光学器件，

        可以把白光分解成不同颜色。'
      initial_sound: s
      character_count: 3
      accepted:
      - 三棱镜
      - 三稜鏡
    tot08:
      target: 走马灯
      definition: '一种传统彩灯，内部转动的轮轴带着剪影，

        使外罩上出现人物或动物循环移动的影像。'
      initial_sound: z
      character_count: 3
      accepted:
      - 走马灯
      - 走馬燈
    tot09:
      target: 螺旋桨
      definition: '围绕轴心转动的多片叶片装置，

        把旋转动力变为推动船只或飞机的力。'
      initial_sound: l
      character_count: 3
      accepted:
      - 螺旋桨
      - 螺旋槳
    tot10:
      target: 海市蜃楼
      definition: '远处景物的光线经过空气折射，

        使海面或沙漠上出现虚幻景象的自然现象。'
      initial_sound: h
      character_count: 4
      accepted:
      - 海市蜃楼
      - 海市蜃樓
    tot11:
      target: 昙花
      definition: '花朵很大、白色，常在夜间开放，

        而且开花时间很短的仙人掌科植物。'
      initial_sound: t
      character_count: 2
      accepted:
      - 昙花
      - 曇花
    tot12:
      target: 榻榻米
      definition: '日式房间中铺在地板上、

        可供坐卧的长方形草编席垫。'
      initial_sound: t
      character_count: 3
      accepted:
      - 榻榻米
