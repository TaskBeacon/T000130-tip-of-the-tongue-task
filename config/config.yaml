stimuli:
  instruction:
    type: text
    font: SimHei
    text: '舌尖现象任务


      每题读一段定义，判断你现在能否想起对应词语。

      按1：已经想起；按2：确信知道、快想起来却说不出；按3：不知道。

      只有第二种“就在嘴边”的体验才算舌尖状态，不必勉强报告。


      选1后输入答案。选2后报告声母、字数及相关词，再尝试找答案。

      声母写完整拼音声母（如 zh/ch/sh）；零声母写0，不用 y/w。

      声母不记得可留空；字数按1至4，不知道按0。

      部分信息阶段若突然想起完整词语，立即按F4，转到完整答案输入。

      文本写好后按F2提交；回车只用于编辑或确认输入法。

      每个文本框会清空。只记得读音、不记得汉字的情况不要当作舌尖状态。


      最后会显示预设词语，请如实核验是否就是你寻找的词。

      共12题，题间可休息。这些新编材料没有常模，不作个人能力判断。

      按空格开始。'
    color: black
    height: 23
    wrapWidth: 1080
    pos:
    - 0
    - 0
  ready:
    type: text
    font: SimHei
    text: '下一题


      准备好后按空格开始。'
    color: black
    height: 24
    wrapWidth: 1080
    pos:
    - 0
    - 0
